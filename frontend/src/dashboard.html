<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - OAuth2 Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>

        <div id="user-profile">
            <img id="user-avatar" src="/assets/default-avatar.svg" alt="User Avatar"
                 style="width: 100px; height: 100px; border-radius: 50%; margin: 20px auto; display: block;">
            <h2 id="user-name">Loading...</h2>
            <p id="user-email" style="color: #666; margin-top: 8px;">Loading...</p>
        </div>

        <div id="token-info" style="margin: 30px 0; padding: 20px; background: #f5f5f5; border-radius: 8px;">
            <p style="margin-bottom: 10px;">Token expires in: <span id="countdown" style="font-weight: 600;">--</span></p>
            <button id="refresh-button">Refresh Now</button>
        </div>

        <button id="logout-button" style="background: #dc3545; margin-top: 10px;">Logout</button>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
