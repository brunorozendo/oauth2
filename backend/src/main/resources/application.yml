server:
  port: 9103
  forward-headers-strategy: framework  # Required per constitution §3.2

spring:
  application:
    name: oauth2-backend

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            redirect-uri: ${BACKEND_REDIRECT_URI:https://backend.brunorozendo.dev/login/oauth2/code/google}
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

app:
  frontend:
    origin: ${FRONTEND_ORIGIN:https://frontend.brunorozendo.dev}
  mobile:
    redirect-uris:
      inventmove: ${APP_MOBILE_REDIRECT_URIS_INVENTMOVE:inventmove://auth}
      bossbill: ${APP_MOBILE_REDIRECT_URIS_BOSSBILL:bossbill://auth}
      # Android: Chrome silently drops server-302s to plain custom schemes due
      # to its user-activation policy, so use the intent:// form — Chrome
      # honors that explicitly for app launches.
      anotadissimo: ${APP_MOBILE_REDIRECT_URIS_ANOTADISSIMO:intent://auth#Intent;scheme=anotadissimo;package=dev.brunorozendo.anotadissimo;end}
      # iOS: ASWebAuthenticationSession intercepts custom-scheme redirects
      # natively, so the plain anotadissimo://auth URI works. The intent:// form
      # is invalid on iOS — Safari surfaces "address is invalid".
      anotadissimo-ios: ${APP_MOBILE_REDIRECT_URIS_ANOTADISSIMO_IOS:anotadissimo://auth}
      # Web: SPA at https://anotadissimo.app. Plain https redirect; the SPA's
      # /auth/callback route reads ?token=… from the URL, stores in localStorage,
      # then history.replaceState to strip it from the URL.
      anotadissimo-web: ${APP_MOBILE_REDIRECT_URIS_ANOTADISSIMO_WEB:https://anotadissimo.app/auth/callback}
      # Chrome extension. EXTENSION_ID is deterministic from the extension's
      # manifest.key (RSA 2048 pubkey base64-DER, set in extension-v2/manifest.json).
      # chrome.identity.launchWebAuthFlow only accepts redirects to the
      # extension's own https://<EXTENSION_ID>.chromiumapp.org/<path>.
      anotadissimo-ext: ${APP_MOBILE_REDIRECT_URIS_ANOTADISSIMO_EXT:https://kolhfjpanhkkohchabchkhflimdomcnk.chromiumapp.org/auth}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-32-bytes-long!!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    # Refresh tokens live 30 days by default — long enough that the user
    # doesn't notice them between sessions, short enough that a leaked one
    # eventually expires on its own.
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
    cookie-name: AUTH_TOKEN
  auth:
    # Comma-separated extra origins permitted to POST /api/auth/exchange
    # and /api/auth/refresh. The web SPA at https://anotadissimo.app and
    # the Chrome extension's chrome-extension://<id> live here.
    allowed-origins: ${APP_AUTH_ALLOWED_ORIGINS:https://anotadissimo.app,chrome-extension://kolhfjpanhkkohchabchkhflimdomcnk}

logging:
  level:
    com.brunorozendo.oauth2: DEBUG
    org.springframework.security: DEBUG
