openapi: 3.0.0
info:
  title: OAuth2 Auth API
  version: 1.0.0
servers:
  - url: https://backend.brunorozendo.dev
    description: Production/Dev Tunnel

paths:
  /auth/login/google:
    get:
      summary: Initiate Google OAuth2 Flow
      responses:
        '200':
          description: Returns authorization URL and state
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl:
                    type: string
                  state:
                    type: string
  /auth/callback:
    get:
      summary: OAuth2 Callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirects to Frontend Dashboard on success
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        '400':
          description: Invalid Request (State mismatch, etc.)
  /auth/user:
    get:
      summary: Get Current User
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  picture:
                    type: string
                  tokenExpiry:
                    type: integer
                    format: int64
        '401':
          description: Not Authenticated
  /auth/refresh:
    post:
      summary: Refresh Access Token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token Refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: refreshed
                  tokenExpiry:
                    type: integer
                    format: int64
                    description: New expiration timestamp
        '401':
          description: Refresh Failed (No token or invalid)
  /auth/logout:
    post:
      summary: Logout
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged Out
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
